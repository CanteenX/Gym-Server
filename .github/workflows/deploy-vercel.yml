# Production deploy of the API only.
#
# This repo used to assemble and deploy all three projects into a single Vercel
# project. It no longer does: the site became a dynamic Next.js app, which needs
# its own runtime and cannot be a folder of static files inside another project.
# The deployment is now split, and the front end owns the domain:
#
#   mid-city-gym      (Gym-frontend)  Next.js, dynamic/ISR  -> owns the domain
#   mid-city-gym-api  (this repo)     Express serverless    -> proxied at /api/*
#
# So a push here deploys the API and nothing else. Building the front ends now
# lives in CanteenX/Gym-frontend.
#
# Deliberately a REMOTE build (no `vercel build` + --prebuilt). The API bundles
# native modules - bcrypt and sharp. A prebuilt deployment ships whatever
# binaries the builder produced, and a runner whose libc or platform differs
# from the Vercel runtime yields "invalid ELF header" or missing-binding crashes
# on every request. Letting Vercel install on its own infrastructure removes
# that entire class of failure.
#
# SECURITY: no ${{ }} expression may be interpolated into a `run:` script.
# GitHub substitutes those textually before the shell parses the line, so a
# free-text input could execute on the runner. Pass them through `env:` and read
# them as shell variables instead.

name: Deploy API to Vercel

on:
  push:
    branches: [main]

  workflow_dispatch:

# Queue rather than cancel: a cancelled deploy can leave the project pointing at
# a half-uploaded build.
concurrency:
  group: vercel-api-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  # NOT VERCEL_PROJECT_ID. That secret still points at the front-end project
  # (which kept the original project id, and therefore the domain), so reusing
  # it here would deploy the API over the public site.
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
  NODE_VERSION: "22"
  # The public origin, used to confirm the front end's /api/* rewrite still
  # resolves to this deployment.
  PUBLIC_ORIGIN: "https://mid-city-gym.vercel.app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Gym-Server
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A missing secret must fail loudly here rather than quietly later. With
      # VERCEL_PROJECT_ID empty and no committed .vercel/ link, the CLI's
      # non-interactive `--yes` path PROVISIONS A NEW PROJECT named after the
      # checkout directory and deploys there: the run goes green, the API lands
      # somewhere nobody is looking, and mid-city-gym-api keeps serving the old
      # release. This is the most likely first-run failure of this workflow,
      # because VERCEL_API_PROJECT_ID is a secret that did not exist before the
      # split.
      - name: Check deploy target
        run: |
          set -euo pipefail
          [ -n "${VERCEL_ORG_ID:-}" ] || { echo "::error::VERCEL_ORG_ID secret is not set"; exit 1; }
          [ -n "${VERCEL_PROJECT_ID:-}" ] || { echo "::error::VERCEL_API_PROJECT_ID secret is not set"; exit 1; }
          echo "Deploy target: $VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # The menu seed step was removed after it ran successfully: the rows now
      # exist, seeding is idempotent but cost ~30s of `npm ci` on every deploy,
      # and it needed DATABASE in CI. Re-run it by hand if menus ever need
      # reseeding:  npm run seed:menus
      - name: Smoke test
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          # `vercel deploy` prints the deployment-SPECIFIC url, which Deployment
          # Protection puts behind SSO: it answers 302 to anonymous requests, so
          # testing it fails even on a perfectly healthy release. The production
          # alias is public, so resolve and test that.
          alias=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.targets.production.alias[0] // empty')

          if [ -n "$alias" ]; then
            base="https://$alias"
          else
            echo "::warning::could not resolve the production alias; testing $DEPLOY_URL instead"
            base="$DEPLOY_URL"
          fi
          echo "Smoke testing $base"

          fail=0

          # A connected database is the only result that means anything here: the
          # function can start, answer, and reach Atlas.
          api=$(curl -sL --max-time 30 "$base/api")
          if printf '%s' "$api" | grep -q '"database":"Connected"'; then
            echo "ok   $base/api -> database Connected"
          else
            echo "::error::$base/api did not report a connected database: $api"
            fail=1
          fi

          # An authenticated route must refuse anonymous access. A 200 here would
          # mean the auth middleware is not running.
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 \
            "$base/api/v1/companies/getCompanyDetails")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "ok   protected route -> $code"
          else
            echo "::error::protected route returned $code, expected 401/403"
            fail=1
          fi

          # Source must not be web-reachable. outputDirectory is set to a throwaway
          # public/ precisely so Vercel's "Other" preset cannot serve the repo root,
          # which would publish the committed .env.
          for path in /.env /server.js /package.json; do
            body=$(curl -sL --max-time 30 "$base$path" | head -c 2000)
            if printf '%s' "$body" | grep -qiE 'DATABASE=|JWT_SECRET|mongodb\+srv://|"dependencies"'; then
              echo "::error::$path appears to expose repository source"
              fail=1
            else
              echo "ok   $path not served as source"
            fi
          done

          # And the front end's rewrite must still land here.
          pub=$(curl -sL --max-time 30 "$PUBLIC_ORIGIN/api")
          if printf '%s' "$pub" | grep -q '"database":"Connected"'; then
            echo "ok   $PUBLIC_ORIGIN/api -> reaches this API"
          else
            echo "::error::$PUBLIC_ORIGIN/api did not reach a healthy API: $pub"
            fail=1
          fi

          exit $fail

      - name: Summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### API deployment"
            echo ""
            echo "- URL: $DEPLOY_URL"
            echo "- Gym-Server commit: $COMMIT_SHA"
            echo "- Public origin: $PUBLIC_ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"
